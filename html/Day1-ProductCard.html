<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="Day1-ProductCard.css">
    <link rel="stylesheet" href="form/themify-icons/themify-icons.css">
</head>
<body>
    <div class="main">
        <div class="card">

            <i class="ti-heart"></i>
            <i class="ti-shopping-cart"></i>
            <div class="card-img">
                <img src="/img/giayXanh.jpg" alt="">
            </div>

            <h3 class="title">Nike Zoom KD 12</h3>
            <p class="price">$99</p>

            <div class="size">Size: 
                <span>6</span>
                <span>7</span>
                <span>8</span>
                <span>9</span>
            </div>
            <div class="color">Color: 
                <span class="color-green"></span>
                <span class="color-red"></span>
                <span class="color-black"></span>
            </div>
            <button class="button-buy">Buy now</button>
            <button class="button-card">Add card</button>
        </div>
</div>
</body>
