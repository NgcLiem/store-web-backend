<!DOCTYPE html>
<html lang="en">
<head>

    <title>Serach Box</title>
    <link rel="stylesheet" href="Day5-SearchBox.css">
    <link rel="stylesheet" href="form/themify-icons/themify-icons.css">
</head>
<body>
    <div class="search-box">
        <input type="text" class="search-box-input">
        <button class="but-search">
            <i class="ti-search"></i>
        </button>
    </div>
</body>
<script>
    var btnSearch = document.querySelector('.but-search')

    btnSearch.addEventListener('click', function(){
        this.parentElement.classList.toggle('open')
        this.previousElementSibling.focus();
    })
