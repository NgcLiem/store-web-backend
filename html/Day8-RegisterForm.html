<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="Day8-RegisterForm.css">
    <link rel="stylesheet" href="form/themify-icons/themify-icons.css">
</head>
<body>
    <div class="register">
        <h2 class="title">Register</h2>
        <form action="">
            <div class="form-control ">
                <input type="text" class="username" placeholder="Username">
                <small></small>
                <span></span>
            </div>

            <div class="form-control">
                <input type="email" class="email" placeholder="Email">
                <small></small>
                <span></span>
            </div>

            <div class="form-control">
                <input type="password" class="password" placeholder="Password">
                <small></small>
                <span></span>
            </div>

            <div class="form-control">
                <input type="password" class="confirm" placeholder="Confirm Password">
                <small></small>
                <span></span>
            </div>
            
            <button class="login">Login</button>

            <div class="signup-link">Not a member? <a href="#">Signup</a></div>
        </form>
    </div>
</body>
<script>
    var username = document.querySelector('.username')
    var email = document.querySelector('.email')
    var password = document.querySelector('.password')
    var confirmPassword = document.querySelector('.confirm')
    var form = document.querySelector('form')

    function showError(input, massage){
        let parent = input.parentElement;
        let small = parent.querySelector('small') 
        parent.classList.add('error')
        small.innerText = massage
    }

    function showSuccess(input){
        let parent = input.parentElement;
        let small = parent.querySelector('small') 
        parent.classList.remove('error')
        small.innerText = ''
    }

    function checkEmptyError(listInput){
        let isEmptyError = false;
        listInput.forEach(input => {
            input.value = input.value.trim();
            
            if(!input.value){
                isEmptyError = true;
                showError(input,'Khong duoc de trong')
            }
            else{
                showSuccess(input)
            }
        });

        return isEmptyError
    }

    function checkEmailError(input){
        const regexEmail =   /^(([^<>()[\]\.,;:\s@\"]+(\.[^<>()[\]\.,;:\s@\"]+)*)|(\".+\"))@(([^<>()[\]\.,;:\s@\"]+\.)+[^<>()[\]\.,;:\s@\"]{2,})$/i;
        input.value = input.value.trim();

        let isEmailError = !regexEmail.test(input.value)
        if(regexEmail.test(input.value)){
            showSuccess(input)
        }
        else{
            showError(input, 'Email invalid')
        }

        return isEmailError
    }

    function checkLengthError(input, min, max){
        input.value = input.value.trim()

        if(input.value.length < min){
            showError(input,`Nhap toi thieu ${min} ky tu`)
            return true
        }

        if(input.value.length > max){
            showError(input,`Nhap toi da ${max} ky tu`)
            return true
        }
        return false
    }

    function checkMatchPasswordError(passwordInput, cfPasswordInput){
        if(passwordInput.value !== cfPasswordInput.value){
            showError(cfPasswordInput, 'Mat khau khong trung khop')
            return true
        }

        return false
    }

    form.addEventListener('submit', function(e){
        e.preventDefault();

        let isEmptyError = checkEmptyError([username, email, password, confirmPassword]);
        let isEmailError = checkEmailError(email)
        let isUsernameLengthError = checkLengthError(username, 3, 10)
        let isPasswordLengthError = checkLengthError(password, 3, 10)
        let isMatchError = checkMatchPasswordError(password, confirmPassword)

    })

</script>
</html>
