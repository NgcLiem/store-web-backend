<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Login</title>
    <link rel="stylesheet" href="fontLogin.css">
    <link rel="stylesheet" href="form/themify-icons/themify-icons.css">
</head>
<body>
    <form action="">
        <div class = "main">
            <div class="exit-button">
                <i class="ti-close"></i>
            </div>

            <div class="img-login">
                <img src="/img/login.jpg" alt="Avatar" class = "avatar">
            </div>

            <div class="container">
                <label for="uname" class="user-name" ><b>Username</b></label>
                <input id = "uname" type="text" placeholder = "Enter username... " class="input" required>
                
                <label for="psw" class="user-name" ><b>Password</b></label>
                <input id = "psw" type="text" placeholder = "Enter password... " class="input" required>
            
                <button class="submit user-name">Login</button>

                <label>
                    <input type="checkbox" checked="checked" name="remember" class ="remember" >
                    Remember me
                </label>
            </div>

            <div class="footer">
                <button type="button" class ="exit">Cancel</button>
                <h3 class="forgot">Forgot <a href="#" class = "link">password?</a></h3>
            </div>

        </div>
    </form>
</body>
