<!DOCTYPE html>
<html>

    <head>
        <title>
            F8-shop
        </title>

        <style>
            .box{
                width: 100%;
                height: 400px;
                background-color: green;
            }
            .box::before{
                display: block;
                content:"";
                width:100px;
                height : 100px;
                background-color: red;
            }
            .box::after{

                display: block;
                content:"letter";
                color: blue;
                width: 100px;
                height : 100px;
                background-color: red;
            }


            h1::first-letter{
                color:aqua;
                font-size: 100px;
            }
            
            h1::first-line{
                color:aquamarine;
            }

            ::selection{
                
                background-color: blueviolet;
                
            }
        </style>
        
    </head>

    <body>
        <div class = "box"> 
            
        </div>
            <h1>CSS pseudo-element; <br />Dong thu 2</h1>

            <ul>
                <li>::before</li>
                <li>::after</li>
                <li>::first-letter </li>
                <li>::first-line</li>
                <li>::selection</li>
                
            </ul>
        
        
    </body>
</html>
