<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font SignUp</title>
    <link rel="stylesheet" href="fontSignUp.css">
    <link rel="stylesheet" href="form/themify-icons/themify-icons.css">
</head>
<body>
    <div>
        <form action="">
            <div class="main">

                <div class="header">
                    <h1 class="text-heading">Sign Up</h1>
                    <p class="nav-heading">Please fill in this form to create an account.</p>
                    <div class="border"></div>
                </div>

                <div class="body-main">
                    <label for=""  class="user"><b>Enter your email</b></label>
                    <input type="text" placeholder="Enter your email..." class = "input">

                    <label for=""  class="user"><b>Password</b></label>
                    <input type="text" placeholder="Password..." class = "input">

                    <label for=""  class="user"><b>Repeat password</b></label>
                    <input type="text" placeholder="Repeat password..." class = "input">

                    <label>
                        <input type="checkbox" checked="checked" class = "checkMe">
                        Remember me
                    </label>

                    <h2 class="text-end"><b>By creating an account you agree to our</b><a href="https://www.youtube.com/">Terms & Privacy.</a></h2>
                </div>

                <div class="footer">
                    <div class="button-end">
                            <button type ="button" class ="button-cancel util">
                                Cancel
                            </button>
                        
                            <button type ="button" class ="button-signup util">
                                Sign up
                            </button>
                    
                    </div>
                </div>
            </div>
        </form>
    </div>
</body>
